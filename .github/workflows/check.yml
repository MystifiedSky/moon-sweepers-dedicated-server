name: checks
on: [push, pull_request, workflow_dispatch]
jobs:
  regressions:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python checks/test_release.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path checks/audit-2026-11-14/Cargo.toml
      - run: cargo build --locked --manifest-path checks/audit-2-2026-11-14/Cargo.toml --bin audit-game
      - run: cargo test --locked --manifest-path checks/audit-2-2026-11-14/Cargo.toml --lib -- --test-threads=1
      - run: cargo build --locked
      - run: python checks/audit-2026-11-14/runtime_regressions.py
      - run: dotnet restore mod/MoonDedicated --locked-mode
      - run: dotnet build mod/MoonDedicated -c Release --no-restore
      - run: dotnet restore mod/MoonLoaderCompatibility --locked-mode
      - run: dotnet build mod/MoonLoaderCompatibility -c Release --no-restore
      - run: dotnet restore checks/loader-compatibility --locked-mode
      - run: dotnet run --project checks/loader-compatibility --no-restore
      - run: dotnet restore checks/audit-2026-11-14/protocol/ProtocolAudit.csproj --locked-mode
      - run: dotnet run --project checks/audit-2026-11-14/protocol/ProtocolAudit.csproj --no-restore
